name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-and-importer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libsdl2-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build without original game files
        run: cmake --build build --parallel 2
      - name: Test synthetic importer and publication boundaries
        run: ctest --test-dir build --output-on-failure
